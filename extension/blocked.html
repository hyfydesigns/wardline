<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocked by Wardline</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: 'Segoe UI', system-ui, sans-serif; background: #f3f5f3; color: #14212c; }
      @media (prefers-color-scheme: dark) { body { background: #0e1a20; color: #e7edea; } }
      .card { max-width: 26rem; text-align: center; padding: 2rem; }
      .shield { width: 3.5rem; height: 3.5rem; margin: 0 auto 1rem; }
      h1 { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 1.6rem; margin: 0 0 .5rem; }
      .reason { font-size: 1.05rem; color: #1f4e79; font-weight: 600; margin: 0 0 1rem; }
      @media (prefers-color-scheme: dark) { .reason { color: #7fb1dc; } }
      .site { font-family: 'Cascadia Code', Consolas, monospace; font-size: .85rem; color: #6b7b76;
        background: rgba(127,127,127,.12); padding: .35rem .7rem; border-radius: 5px; display: inline-block; word-break: break-all; }
      p.note { font-size: .85rem; color: #6b7b76; margin-top: 1.5rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="shield" viewBox="0 0 24 24" fill="none">
        <path d="M12 2 L21 5.5 V11 C21 16.5 17.2 20.8 12 22 C6.8 20.8 3 16.5 3 11 V5.5 Z" stroke="#2e7d5b" stroke-width="1.4" />
        <path d="M9 12.5 L11 14.5 L15.5 9.5" stroke="#2e7d5b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1>This page is blocked</h1>
      <p class="reason" id="reason">Blocked by Wardline</p>
      <span class="site" id="site"></span>
      <p class="note">If you think this is a mistake, ask your parent to review it in Wardline.</p>
    </div>
    <script src="blocked.js"></script>
  </body>
</html>
