<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      body { width: 240px; margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; color: #14212C; background: #fff; }
      .head { display: flex; align-items: center; gap: .5rem; padding: .8rem .9rem; border-bottom: 1px solid #DEE4E0; }
      .head strong { font-size: 1rem; }
      .dot { width: .55rem; height: .55rem; border-radius: 50%; background: #2E7D5B; }
      .dot.off { background: #C0392E; }
      .body { padding: .8rem .9rem; font-size: .82rem; color: #3B4C52; }
      .row { display: flex; justify-content: space-between; padding: .25rem 0; }
      .row span:last-child { font-family: 'Cascadia Code', Consolas, monospace; color: #14212C; }
      .foot { padding: .6rem .9rem; border-top: 1px solid #DEE4E0; font-size: .72rem; color: #8A968F; }
    </style>
  </head>
  <body>
    <div class="head"><span class="dot" id="dot"></span><strong>Wardline Monitor</strong></div>
    <div class="body">
      <div class="row"><span>Status</span><span id="status">—</span></div>
      <div class="row"><span>Events sent</span><span id="sent">0</span></div>
      <div class="row"><span>Last sync</span><span id="last">never</span></div>
    </div>
    <div class="foot">Protecting this device on your family's Wardline plan. Managed by a parent.</div>
    <script src="popup.js"></script>
  </body>
</html>
